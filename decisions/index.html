     stylesheet it BLOCKS FIRST PAINT for its whole download — ~203 KB even
     brotli'd, which is several seconds on a slow link before anything appears.
     Loaded as media="print" the browser fetches it without blocking, then
     onload promotes it to all. Every face already declares font-display:swap,
     so text paints immediately in the fallback and swaps when the real face
     lands; nothing is ever invisible. -->
<link rel="stylesheet" href="fonts.css" media="print" onload="this.media='all';this.onload=null">

       button is needed. -->

<!-- defer, so the shell paints while questions.js (1.3 MB generated corpus,
     ~424 KB brotli) is still arriving instead of after it. Deferred scripts
     still execute in order, which app.js depends on: it reads window.QUESTIONS
     and the diagram vocabulary at startup. -->
<script src="questions.js" defer></script>
<script src="diagram.js" defer></script>
<script src="mockups-data.js" defer></script>
<script src="app.js" defer></script>
<script>
/* Registered after load so it never competes with the first paint for bandwidth.
   A failed registration (an old browser, a blocked scope) is silent and harmless --
   the site already works with no service worker at all; this only adds the offline
   cache and the install prompt. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
/* The browser decides installability (manifest + service worker + a few visits),
   not us; this only shows the button once the browser has already decided yes,
   and asks again after use since the same deferred prompt cannot fire twice. */
var deferredInstall = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredInstall = e;
  document.getElementById('installBtn').hidden = false;
});
document.getElementById('installBtn').addEventListener('click', function () {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(function () {
    deferredInstall = null;
    document.getElementById('installBtn').hidden = true;
  });
});
window.addEventListener('appinstalled', function () {
  document.getElementById('installBtn').hidden = true;
});
</script>
